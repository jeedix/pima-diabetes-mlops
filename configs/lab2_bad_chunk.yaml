data:
  raw_path: data/raw/pima-indians-diabetes.csv
  target: Outcome
  test_size: 0.2
  seed: 42
  chunk_size: 8

pipeline:
  imputer_strategy: median
  scaler: standard
  model: logreg
  model_params:
    max_iter: 1000
    class_weight: balanced

training:
  mode: full
  n_bootstrap: 1000
  mlflow_experiment: lab2_pima
